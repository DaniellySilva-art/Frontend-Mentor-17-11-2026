<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Order summary card</title>
</head>
<body>

  <main>
    <article class="card">

      <!-- Hero illustration -->
      <img
        class="card__hero"
        src="./images/illustration-hero.svg"
        alt="Person dancing while listening to music on headphones"
      >

      <!-- Card content -->
      <div class="card__body">

        <h1 class="card__title">Order Summary</h1>

        <p class="card__desc">
          You can now listen to millions of songs, audiobooks, and podcasts
          on any device anywhere you like!
        </p>

        <!-- Plan row -->
        <div class="plan">
          <div class="plan__icon-wrap">
            <img src="./images/icon-music.svg" alt="">
          </div>
          <div class="plan__info">
            <p class="plan__name">Annual Plan</p>
            <p class="plan__price">$59.99/year</p>
          </div>
          <a href="#" class="plan__change">Change</a>
        </div>

        <!-- CTA -->
        <button class="btn-payment" type="button">Proceed to Payment</button>

        <a href="#" class="btn-cancel">Cancel Order</a>

      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer">
      Frontend Mentor
    </a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>
</html>
